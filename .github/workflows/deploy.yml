
name: Deploy LifeTrack Training

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
        

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Diagnostic PWA files
        run: |
          echo "=== Fichiers dans public ==="
          find public -maxdepth 3 -type f
          echo "=== Fichiers dans dist ==="
          find dist -maxdepth 3 -type f
          echo "=== Vérification des icônes ==="
          test -f dist/icons/icon-192.png
          test -f dist/icons/icon-512.png


      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
